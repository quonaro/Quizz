name: Build and Release

on:
  push:
    branches:
      - simple
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Pandoc and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-cyrillic
    
    - name: Convert Markdown to PDF
      run: |
        pandoc instruction.md -o instruction.pdf --pdf-engine=xelatex -V geometry:margin=1in
    
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: instruction-pdf
        path: instruction.pdf
        retention-days: 1

  build-and-release:
    runs-on: windows-latest
    needs: convert-pdf
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build executable
      run: |
        python build_exe.py
    
    - name: Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: instruction-pdf
    
    - name: Create release archive
      run: |
        mkdir release
        Copy-Item dist\Quiz.exe release\
        Copy-Item instruction.pdf release\
        Compress-Archive -Path release\* -DestinationPath Quiz-Release.zip
    
    - name: Read and increment version
      id: version
      run: |
        $version = Get-Content VERSION -Raw
        $version = $version.Trim()
        $parts = $version.Split('.')
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2]
        $patch++
        $newVersion = "$major.$minor.$patch"
        Set-Content VERSION $newVersion
        echo "version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "Current version: $newVersion"
    
    - name: Commit version bump
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add VERSION
        git commit -m "Bump version to ${{ steps.version.outputs.version }}"
        git push
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Quiz v${{ steps.version.outputs.version }}
        body: |
          Автоматический релиз квиза
          
          Содержимое архива:
          - Quiz.exe - исполняемый файл для Windows (все ресурсы встроены)
          - instruction.pdf - инструкция по использованию
          
          Для запуска распакуйте архив и запустите Quiz.exe
        files: |
          Quiz-Release.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
