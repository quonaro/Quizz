name: Build and Release

on:
  push:
    branches:
      - simple
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Pandoc and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-cyrillic
    
    - name: Convert Markdown to PDF
      run: |
        pandoc instruction.md -o instruction.pdf --pdf-engine=xelatex -V geometry:margin=1in
    
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: instruction-pdf
        path: instruction.pdf
        retention-days: 1

  build-and-release:
    runs-on: windows-latest
    needs: convert-pdf
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build executable
      run: |
        python build_exe.py
    
    - name: Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: instruction-pdf
    
    - name: Create release archive
      run: |
        mkdir release
        Copy-Item dist\Quiz.exe release\
        Copy-Item instruction.pdf release\
        Copy-Item images release\ -Recurse
        Copy-Item questions-auto.json release\
        Compress-Archive -Path release\* -DestinationPath Quiz-Release.zip
    
    - name: Get current date
      id: date
      run: echo "date=$(Get-Date -Format 'yyyy-MM-dd-HHmm')" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: release-${{ steps.date.outputs.date }}
        name: Quiz Release ${{ steps.date.outputs.date }}
        body: |
          Автоматический релиз квиза
          
          Содержимое архива:
          - Quiz.exe - исполняемый файл для Windows
          - instruction.pdf - инструкция по использованию
          - images/ - папка с изображениями
          - questions-auto.json - файл с вопросами
          
          Для запуска распакуйте архив и запустите Quiz.exe
        files: |
          Quiz-Release.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
