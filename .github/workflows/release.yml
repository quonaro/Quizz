name: Build and Release

on:
  push:
    branches:
      - simple
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Pandoc and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-cyrillic fonts-liberation fonts-noto-color-emoji
    
    - name: Convert Markdown to PDF
      run: |
        pandoc CODE_TUTORIAL.md -o CODE_TUTORIAL.pdf \
          --pdf-engine=xelatex \
          -V geometry:margin=1in \
          -V mainfont="Liberation Sans" \
          -V monofont="Liberation Mono" \
          -V lang=ru-RU
    
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: tutorial-pdf
        path: CODE_TUTORIAL.pdf
        retention-days: 1

  build-and-release:
    runs-on: windows-latest
    needs: convert-pdf
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build executable
      run: |
        python build_exe.py
    
    - name: Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: tutorial-pdf
    
    - name: Create release archive
      run: |
        mkdir release
        Copy-Item dist\Quiz.exe release\
        Copy-Item CODE_TUTORIAL.pdf release\
        
        # Создаем папку code с исходниками
        mkdir release\code
        Copy-Item main.py release\code\
        Copy-Item questions-auto.json release\code\
        Copy-Item CODE_TUTORIAL.md release\code\
        Copy-Item images release\code\ -Recurse
        
        Compress-Archive -Path release\* -DestinationPath Quiz-Release.zip
    
    - name: Read and increment version
      id: version
      run: |
        $version = Get-Content VERSION -Raw
        $version = $version.Trim()
        $parts = $version.Split('.')
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2]
        $patch++
        $newVersion = "$major.$minor.$patch"
        Set-Content VERSION $newVersion
        echo "version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "Current version: $newVersion"
    
    - name: Commit version bump
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add VERSION
        git commit -m "Bump version to ${{ steps.version.outputs.version }}"
        git push
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Quiz v${{ steps.version.outputs.version }}
        body: |
          Автоматический релиз квиза
          
          Содержимое архива:
          - Quiz.exe - исполняемый файл для Windows (все ресурсы встроены)
          - CODE_TUTORIAL.pdf - подробный учебник по коду программы
          - code/ - папка с исходным кодом:
            - main.py - исходный код программы с комментариями
            - CODE_TUTORIAL.md - учебник в формате Markdown
            - images/ - папка с изображениями
            - questions-auto.json - файл с вопросами
          
          Для запуска распакуйте архив и запустите Quiz.exe
          Для изучения кода прочитайте CODE_TUTORIAL.pdf или откройте папку code/
        files: |
          Quiz-Release.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
