name: Build Application

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable_name: quiz-linux
          - os: windows-latest
            platform: windows
            executable_name: quiz-windows.exe
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git describe

      - name: Calculate version from commits
        id: version
        shell: bash
        run: |
          # Get base version from pyproject.toml
          BASE_VERSION=$(grep -m 1 "^version" pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d ' ')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="0.1.0"
          fi
          
          # Extract major and minor from base version
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          
          # Count total commits in repository
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          
          # Try to get the latest version tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LATEST_TAG" ]; then
            # Extract version from tag (remove 'v' prefix if present)
            TAG_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
            # Count commits since last tag
            COMMITS_SINCE_TAG=$(git rev-list --count ${LATEST_TAG}..HEAD)
            # Extract patch version from tag
            TAG_PATCH=$(echo "$TAG_VERSION" | cut -d. -f3)
            if [ -z "$TAG_PATCH" ]; then
              TAG_PATCH="0"
            fi
            # Add commits since tag to patch version
            NEW_PATCH=$((TAG_PATCH + COMMITS_SINCE_TAG))
            # Reconstruct version with new patch
            TAG_MAJOR=$(echo "$TAG_VERSION" | cut -d. -f1)
            TAG_MINOR=$(echo "$TAG_VERSION" | cut -d. -f2)
            VERSION="${TAG_MAJOR}.${TAG_MINOR}.${NEW_PATCH}"
          else
            # No tags found, use base version with commit count as patch
            VERSION="${MAJOR}.${MINOR}.${TOTAL_COMMITS}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "total_commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          
          echo "Calculated version: $VERSION (from $TOTAL_COMMITS commits)"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            build-essential \
            libgl1 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            patchelf

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache PyInstaller build cache
        uses: actions/cache@v4
        with:
          path: build/.pyinstaller-cache
          key: ${{ runner.os }}-pyinstaller-${{ matrix.platform }}-${{ hashFiles('main.py', 'src/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-${{ matrix.platform }}-
            ${{ runner.os }}-pyinstaller-

      - name: Build application
        shell: bash
        env:
          # Set PyInstaller cache directory
          PYINSTALLER_CACHE_DIR: ${{ github.workspace }}/build/.pyinstaller-cache
        run: |
          chmod +x build.sh
          # Use incremental build to leverage cache
          ./build.sh --platform ${{ matrix.platform }} --no-clean

      - name: Find executable
        id: find-exe
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -f "build/quiz.exe" ]; then
              echo "executable=build/quiz.exe" >> $GITHUB_OUTPUT
              echo "name=${{ matrix.executable_name }}" >> $GITHUB_OUTPUT
            elif [ -f "quiz.exe" ]; then
              echo "executable=quiz.exe" >> $GITHUB_OUTPUT
              echo "name=${{ matrix.executable_name }}" >> $GITHUB_OUTPUT
            fi
          else
            if [ -f "build/quiz" ]; then
              echo "executable=build/quiz" >> $GITHUB_OUTPUT
              echo "name=${{ matrix.executable_name }}" >> $GITHUB_OUTPUT
            elif [ -f "quiz" ]; then
              echo "executable=quiz" >> $GITHUB_OUTPUT
              echo "name=${{ matrix.executable_name }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Verify executable
        if: steps.find-exe.outputs.executable != ''
        shell: bash
        run: |
          EXE="${{ steps.find-exe.outputs.executable }}"
          if [ -f "$EXE" ]; then
            SIZE=$(stat -f%z "$EXE" 2>/dev/null || stat -c%s "$EXE" 2>/dev/null || echo "unknown")
            echo "✅ Executable found: $EXE"
            echo "📦 Size: $SIZE bytes"
          else
            echo "❌ Executable not found: $EXE"
            exit 1
          fi

      - name: Upload artifact
        if: steps.find-exe.outputs.executable != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-exe.outputs.name }}
          path: ${{ steps.find-exe.outputs.executable }}
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }} (from ${{ steps.version.outputs.total_commits }} commits)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Executable |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.find-exe.outputs.executable }}" != "" ]; then
            echo "| ${{ matrix.os }} | ✅ Success | ${{ steps.find-exe.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ${{ matrix.os }} | ❌ Failed | Not found |" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git describe

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find release-artifacts -type f || echo "No artifacts found"
          ls -lh release-artifacts/ || true

      - name: Extract version and create release info
        id: release-info
        run: |
          # Get base version from pyproject.toml
          BASE_VERSION=$(grep -m 1 "^version" pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d ' ')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="0.1.0"
          fi
          
          # Extract major and minor from base version
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          
          # Count total commits in repository
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          
          # Try to get the latest version tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LATEST_TAG" ]; then
            # Extract version from tag (remove 'v' prefix if present)
            TAG_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
            # Count commits since last tag
            COMMITS_SINCE_TAG=$(git rev-list --count ${LATEST_TAG}..HEAD)
            # Extract patch version from tag
            TAG_PATCH=$(echo "$TAG_VERSION" | cut -d. -f3)
            if [ -z "$TAG_PATCH" ]; then
              TAG_PATCH="0"
            fi
            # Add commits since tag to patch version
            NEW_PATCH=$((TAG_PATCH + COMMITS_SINCE_TAG))
            # Reconstruct version with new patch
            TAG_MAJOR=$(echo "$TAG_VERSION" | cut -d. -f1)
            TAG_MINOR=$(echo "$TAG_VERSION" | cut -d. -f2)
            VERSION="${TAG_MAJOR}.${TAG_MINOR}.${NEW_PATCH}"
          else
            # No tags found, use base version with commit count as patch
            VERSION="${MAJOR}.${MINOR}.${TOTAL_COMMITS}"
          fi
          
          # Get short SHA
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # Create release tag
          RELEASE_TAG="v${VERSION}-${SHORT_SHA}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "total_commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          
          echo "Base version: $BASE_VERSION"
          echo "Total commits: $TOTAL_COMMITS"
          if [ -n "$LATEST_TAG" ]; then
            echo "Latest tag: $LATEST_TAG"
            echo "Commits since tag: $COMMITS_SINCE_TAG"
          fi
          echo "Calculated version: $VERSION"
          echo "Release tag: $RELEASE_TAG"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: Release ${{ steps.release-info.outputs.version }} (${{ steps.release-info.outputs.short_sha }})
          body: |
            ## Release ${{ steps.release-info.outputs.version }}
            
            **Commit:** ${{ steps.release-info.outputs.short_sha }}
            **Branch:** ${{ github.ref_name }}
            
            ### Downloads
            - **Windows**: `quiz-windows.exe`
            - **Linux**: `quiz-linux`
            
            ### Installation
            1. Download the executable for your platform
            2. Make it executable (Linux): `chmod +x quiz-linux`
            3. Run the application
            
            ### Usage
            ```bash
            # Run with default quiz
            ./quiz
            
            # Run with specific quiz file
            ./quiz /path/to/quiz.json
            ```
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false
